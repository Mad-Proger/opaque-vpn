[package]
name = "opaque-vpn"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
ctrlc = "3.4.7"
env_logger = "0.11.8"
etherparse = "0.19.0"
futures = "0.3.31"
log = "0.4.27"
obfswire = { version = "0.0.4", features = ["tokio-stream-impl"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["net", "rt", "sync"] }
tokio-rustls = "0.26.2"
tokio-util = { version = "0.7.16", features = ["compat"] }
toml = "0.9.5"
tun = { version = "0.8.3", features = ["async"] }
slint = "1.12.1"
rfd = "0.15.4"

[build-dependencies]
slint-build = "1.12.1"
